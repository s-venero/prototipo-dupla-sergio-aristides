<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArenaCash — Indique um amigo e ganhe R$ 50</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul-escuro: #0a2a6b;
      --azul: #1d4ed8;
      --azul-claro: #3b82f6;
      --branco: #ffffff;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: #e8eefc;
      color: var(--branco);
    }

    .slide {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6vw;
      overflow: hidden;
      background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 55%, var(--azul-claro) 100%);
    }

    /* Círculos decorativos */
    .slide::before,
    .slide::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .slide::before {
      width: 520px;
      height: 520px;
      right: -140px;
      top: -160px;
    }

    .slide::after {
      width: 340px;
      height: 340px;
      right: 12%;
      bottom: -170px;
      background: rgba(255, 255, 255, 0.12);
    }

    .conteudo {
      position: relative;
      z-index: 1;
      max-width: 780px;
    }

    .marca {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    h1 span {
      color: #bfdbfe;
    }

    .subtitulo {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      line-height: 1.5;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      max-width: 560px;
      margin-bottom: 2.5rem;
    }

    .botao {
      display: inline-block;
      background: var(--branco);
      color: var(--azul);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .botao:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
    }

    .botao:focus-visible {
      outline: 3px solid #bfdbfe;
      outline-offset: 3px;
    }

    /* Slide de depoimento */
    .depoimento {
      max-width: 640px;
      margin-top: 2rem;
      padding: 2rem 2.2rem;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
    }

    .depoimento blockquote {
      font-size: clamp(1.3rem, 2.6vw, 1.9rem);
      line-height: 1.4;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .depoimento figcaption {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.88);
    }

    .depoimento figcaption strong {
      color: var(--branco);
    }
  </style>
</head>
<body>

  <section class="slide">
    <div class="conteudo">
      <div class="marca">ArenaCash</div>
      <h1>Indique um amigo e <span>ganhe R$ 50</span></h1>
      <p class="subtitulo">
        Convide quem você gosta para conhecer a ArenaCash e receba R$ 50 pela indicação.
      </p>
      <a class="botao" href="#">Quero indicar</a>
    </div>
  </section>

  <section class="slide">
    <div class="conteudo">
      <div class="marca">ArenaCash</div>
      <h1>Quem indicou, <span>aprovou</span></h1>
      <figure class="depoimento">
        <blockquote>
          “Indiquei um amigo e ganhei R$ 50. Foi o jeito mais fácil de conseguir um dinheiro extra.”
        </blockquote>
        <figcaption><strong>Marina Duarte</strong> · cliente fictícia da ArenaCash</figcaption>
      </figure>
    </div>
  </section>

</body>
</html>
